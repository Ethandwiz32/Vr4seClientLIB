name: Build vr4seclient.so

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Android NDK r25c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Build libvr4seclient.so
        run: |
          ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            -j$(nproc)

      - name: Upload .so as artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvr4seclient
          path: libs/arm64-v8a/libvr4seclient.so
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "vr4seclient build #${{ github.run_number }}"
          files: libs/arm64-v8a/libvr4seclient.so
          body: "Auto-built .so — drop into lib/arm64-v8a/ via APKToolkit"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
