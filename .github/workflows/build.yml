name: Build vr4seclient v3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Android NDK r25c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: true

      - name: Download Dobby prebuilt (AArch64)
        run: |
          mkdir -p libs/arm64-v8a
          # Dobby release: static lib for Android arm64
          # Source: https://github.com/jmpews/Dobby
          # We pull a known-good prebuilt from the Dobby CI artifacts.
          # Replace this URL with your own Dobby build if needed.
          curl -L "https://github.com/jmpews/Dobby/releases/download/v1.0/libdobby-arm64-android.a" \
               -o libs/arm64-v8a/libdobby.a 2>/dev/null || \
          # Fallback: build Dobby from source in this CI step
          (
            sudo apt-get install -y cmake ninja-build &&
            git clone --depth 1 https://github.com/jmpews/Dobby.git /tmp/dobby &&
            mkdir -p /tmp/dobby/build && cd /tmp/dobby/build &&
            cmake .. \
              -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
              -DANDROID_ABI=arm64-v8a \
              -DANDROID_PLATFORM=android-29 \
              -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release \
              -GNinja &&
            ninja -j$(nproc) &&
            cp libdobby.a $GITHUB_WORKSPACE/libs/arm64-v8a/
          )
          ls -lh libs/arm64-v8a/

      - name: Build libvr4seclient.so
        run: |
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk \
            -j$(nproc)

      - name: Upload .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvr4seclient-v3
          path: libs/arm64-v8a/libvr4seclient.so
          retention-days: 30

      - name: Upload full libs folder
        uses: actions/upload-artifact@v4
        with:
          name: libs-arm64
          path: libs/arm64-v8a/
          retention-days: 30
